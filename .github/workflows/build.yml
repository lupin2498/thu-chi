name: Build APK & iOS

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Test + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing_sha256: ${{ steps.signing.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cài thư viện
        run: flutter pub get

      - name: Phân tích mã
        run: flutter analyze

      - name: Kiểm thử Dart
        run: flutter test

      # Khoá ký (APK phải cùng khoá thì mới cài đè lên bản trước, giữ được dữ liệu):
      #  1. secret ANDROID_KEYSTORE_BASE64 nếu có;
      #  2. nếu không: khoá tự tạo, giữ trong một bản nháp Release (chỉ người có quyền ghi repo thấy được)
      #     để mọi nhánh và mọi lần build dùng chung một khoá;
      #  3. actions/cache chỉ còn để lấy lại khoá của các bản build trước (cache bị xoá sau 7 ngày không dùng
      #     và không dùng chung giữa các nhánh nên không đủ tin cậy).
      - name: Khôi phục khoá ký (cache của các bản build trước)
        uses: actions/cache@v4
        with:
          path: ~/.android-signing
          key: android-signing-v1

      - name: Chuẩn bị khoá ký
        id: signing
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_RELEASE: signing-key
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          DIR="$HOME/.android-signing"
          mkdir -p "$DIR"
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$DIR/secret.jks"; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KEYPASS="$KEY_PASSWORD"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            SOURCE="secret"
          else
            KS="$DIR/release.jks"; PASS=sothuchi-ci; ALIAS=sothuchi; KEYPASS=sothuchi-ci
            valid() { [ -f "$1" ] && keytool -list -keystore "$1" -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; }
            STORED="$RUNNER_TEMP/signing-stored"
            rm -rf "$STORED" && mkdir -p "$STORED"
            gh release download "$SIGNING_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern release.jks --dir "$STORED" \
              || echo "Chưa có bản nháp Release giữ khoá ký"
            if valid "$STORED/release.jks"; then
              cp "$STORED/release.jks" "$KS"
              SOURCE="bản nháp Release"
            elif valid "$KS"; then
              SOURCE="cache của bản build trước"
            else
              rm -f "$KS"
              keytool -genkeypair -keystore "$KS" \
                -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$KEYPASS" \
                -dname "CN=So Thu Chi, O=So Thu Chi, C=VN"
              SOURCE="tạo mới"
            fi
            if ! valid "$STORED/release.jks"; then
              gh release create "$SIGNING_RELEASE" "$KS" --repo "$GITHUB_REPOSITORY" --draft \
                --title "Khoá ký APK (bản nháp riêng tư – không xoá, không Publish)" \
                --notes "Workflow build giữ khoá ký APK ở đây để mọi lần build dùng cùng một khoá (cài đè lên bản trước, giữ dữ liệu). Bản nháp chỉ người có quyền ghi repo mới thấy. Xoá bản nháp này thì bản build sau sẽ ký bằng khoá mới và phải gỡ app cũ trước khi cài." \
                || echo "::warning::Không lưu được khoá ký vào bản nháp Release - lần build sau có thể ký bằng khoá khác"
            fi
            rm -rf "$STORED"
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          if [ -z "$FP" ]; then echo "::error::Không đọc được khoá ký"; exit 1; fi
          echo "Khoá ký lấy từ: $SOURCE - chứng chỉ SHA-256: $FP"
          echo "sha256=$FP" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"

      - name: Build APK (bản tiêu chuẩn + bản đầy đủ)
        run: |
          flutter build apk --release --flavor standard
          flutter build apk --release --flavor full

      # Thiếu cấu hình ký thì Gradle lặng lẽ dùng khoá debug -> chặn ngay ở đây.
      - name: Kiểm tra chữ ký APK
        env:
          SIGNING_SHA256: ${{ steps.signing.outputs.sha256 }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for f in app-standard-release.apk app-full-release.apk; do
            D=$("$APKSIGNER" verify --print-certs "build/app/outputs/flutter-apk/$f" \
              | grep -m1 'certificate SHA-256 digest' | sed 's/.*: *//')
            echo "$f: $D"
            if [ "$D" != "$SIGNING_SHA256" ]; then
              echo "::error::$f không được ký bằng khoá phát hành ($SIGNING_SHA256)"; exit 1
            fi
          done

      # Bản tiêu chuẩn phải cài được qua Play Protect: không có quyền đọc thông báo / SMS / trợ năng / hiển thị trên app khác.
      - name: Kiểm tra quyền của bản tiêu chuẩn
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$AAPT" dump xmltree build/app/outputs/flutter-apk/app-standard-release.apk --file AndroidManifest.xml > standard-manifest.txt
          if grep -E "BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|RECEIVE_SMS|READ_SMS|SYSTEM_ALERT_WINDOW" standard-manifest.txt; then
            echo "::error::Bản tiêu chuẩn chứa quyền bị Play Protect chặn"; exit 1
          fi
          "$AAPT" dump xmltree build/app/outputs/flutter-apk/app-full-release.apk --file AndroidManifest.xml | grep -q BIND_NOTIFICATION_LISTENER_SERVICE
          echo "OK"

      - name: Đổi tên APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-standard-release.apk "dist/SoThuChi-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-full-release.apk "dist/SoThuChi-${VERSION}-full.apk"
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 30

      - name: Kiểm thử Kotlin (parser, luồng thông báo - Robolectric)
        working-directory: android
        run: ./gradlew :app:testStandardDebugUnitTest :app:testFullDebugUnitTest --stacktrace

      - name: Báo cáo test Kotlin
        if: failure()
        run: |
          find build/app/test-results -name "*.xml" -exec grep -l "<failure" {} \; | xargs -r -I{} sh -c 'echo "== {}"; grep -A30 "<failure" {} | head -60'

  ios:
    name: iOS (IPA chưa ký)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cài thư viện
        run: flutter pub get

      - name: Build iOS (không ký)
        run: flutter build ios --release --no-codesign

      - name: Đóng gói IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          rm -rf build/ipa && mkdir -p build/ipa/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../../dist/SoThuChi-${VERSION}-unsigned.ipa" Payload)
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: dist/*.ipa
          retention-days: 30

  release:
    name: Phát hành
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Thông tin phiên bản
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "tag=v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sổ Thu Chi ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
          body: |
            **Android – bản tiêu chuẩn (khuyên dùng):** `SoThuChi-${{ steps.meta.outputs.version }}.apk` – cài bình thường (không bị Play Protect chặn).
            Chuyển khoản xong, bấm **Chia sẻ** biên lai trong app ngân hàng → **Ghi vào Sổ Thu Chi**: cửa sổ ghi nhanh hiện số tiền đọc sẵn, micro chờ nói tên khoản.

            **Android – bản đầy đủ:** `SoThuChi-${{ steps.meta.outputs.version }}-full.apk` – tự bật cửa sổ khi có thông báo biến động số dư (không cần bấm Chia sẻ).
            Có quyền đọc thông báo nên Play Protect chặn khi mở tệp từ trình duyệt / Zalo / trình quản lý tệp: cài bằng `adb install` từ máy tính,
            hoặc tạm tắt "Quét ứng dụng bằng Play Protect" (CH Play → ảnh đại diện → Play Protect → ⚙) rồi bật lại sau khi cài. Hai bản cài đè lên nhau, giữ nguyên dữ liệu.

            **iPhone:** `SoThuChi-${{ steps.meta.outputs.version }}-unsigned.ipa` – cài bằng Sideloadly / AltStore / TrollStore (ký bằng Apple ID của bạn).

            Chứng chỉ ký APK (SHA-256): `${{ needs.android.outputs.signing_sha256 }}` – APK cùng chứng chỉ thì cài đè lên nhau được.
            Commit: ${{ github.sha }}
